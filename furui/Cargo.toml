[package]
name = "furui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Per-process egress and ingress control for containers, enforced with eBPF."

[dependencies]
furui-common = { path = "../furui-common", default-features = false, features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }

clap = { workspace = true, features = ["derive"] }

tracing = "0.1"
tracing-core = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
# NOTE: `serde_yaml` is deprecated upstream; 0.9.34 is its final release. It
# still parses our policy files correctly, so replacing it is a separate
# decision rather than a version bump.
serde_yaml = "0.9.34"
serde_json = "1.0"
dns-lookup = "3.0"
bollard = "0.21"
futures = "0.3"
thiserror = "2"
pnet_datalink = "0.35"
# Not referenced directly: `tonic::include_proto!` expands to code that uses them.
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tower = "0.5"
hyper-util = "0.1"


[dev-dependencies]
# Integration tests see only furui's public API, so anything they use has to be
# declared again here.
bollard = "0.21"
libc = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
anyhow = { workspace = true, default-features = true }
aya-build = { workspace = true }

# Declared so that cargo rebuilds us when `furui-ebpf`'s *library* target or any
# of its dependencies change. `aya_build` additionally emits a
# `rerun-if-changed` for the crate directory, which covers its *binary* target.
furui-ebpf = { path = "../furui-ebpf" }

protobuf-src = "2.1"
# tonic 0.14 split prost codegen out of `tonic-build` into `tonic-prost-build`.
tonic-prost-build = "0.14"

[[bin]]
name = "furui"
path = "src/main.rs"

[lints]
workspace = true
