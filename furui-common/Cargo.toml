[package]
name = "furui-common"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Types shared between furui's userspace and eBPF halves."

[features]
default = ["ebpf"]
# The eBPF side needs aya's `cty`; the userspace side must not link `aya-ebpf`.
# See the `cty` module in src/lib.rs.
ebpf = ["dep:aya-ebpf"]
user = ["dep:aya", "dep:libc"]

[dependencies]
furui-macros = { path = "../furui-macros" }
aya = { workspace = true, optional = true }
aya-ebpf = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
