[workspace]
resolver = "2"
members = ["furui", "furui-common", "furui-ebpf", "furui-macros", "xtask"]
# `furui-ebpf` is deliberately excluded: it only builds for `bpf*-unknown-none`
# and is compiled by `furui`'s build script. Everything else should be covered
# by a bare `cargo build` / `cargo clippy` / `cargo test`.
default-members = ["furui", "furui-common", "furui-macros", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kensuke Kubo <kensuke.kubo@ken109.dev>"]
repository = "https://github.com/ken109/furui-rs"

[workspace.lints.clippy]
# `TCP`, `UDP` and `ICMP` are how these protocols are spelled in the RFCs, in
# the policy YAML and in `furui-ebpf/src/README.md`. Renaming them to `Tcp` and
# friends would make the code disagree with its own domain vocabulary.
upper_case_acronyms = "allow"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
# Default features on purpose: turning them off also drops `help`, `usage` and
# `error-context`, which left `furui --help` reporting "unexpected argument
# found" and errors with no usage line.
clap = { version = "4.6" }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false }
which = { version = "8.0", default-features = false }

# NOTE: no workspace-wide `panic = "abort"`. The `bpf*-unknown-none` targets
# already specify abort in their target spec, so furui-ebpf does not need it,
# while setting it here made the host crates unwind across abort-compiled
# frames: every failing test died with SIGSEGV instead of reporting.

[profile.release.package.furui-ebpf]
debug = 2
codegen-units = 1
