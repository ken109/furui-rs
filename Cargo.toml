[workspace]
resolver = "2"
members = ["furui", "furui-common", "furui-ebpf", "furui-macros", "xtask"]
# `furui-ebpf` is deliberately excluded: it only builds for `bpf*-unknown-none`
# and is compiled by `furui`'s build script. Everything else should be covered
# by a bare `cargo build` / `cargo clippy` / `cargo test`.
default-members = ["furui", "furui-common", "furui-macros", "xtask"]

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.6", default-features = false, features = ["std"] }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false }
which = { version = "8.0", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.release.package.furui-ebpf]
debug = 2
codegen-units = 1
