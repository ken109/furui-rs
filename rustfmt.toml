group_imports = "StdExternalCrate"
imports_granularity = "Crate"
reorder_imports = true
unstable_features = true

# `furui-ebpf/src/vmlinux.rs` is 60k lines of bindgen output regenerated by
# `cargo xtask codegen` and never committed. Formatting it is pointless, and
# leaving it in would mean the result depends on whether it has been generated
# yet.
ignore = ["furui-ebpf/src/vmlinux.rs"]
